[project]
name = "progressive-autonomy-agent-harness"
version = "0.1.0"
description = "A reversible, trust-gated content queue agent harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2,<3",
  "psycopg2-binary>=2.9,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
