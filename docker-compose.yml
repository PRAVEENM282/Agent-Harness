services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harness}
      POSTGRES_USER: ${POSTGRES_USER:-harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
    volumes:
      - harness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harness} -d ${POSTGRES_DB:-harness}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:-harness}@db:5432/${POSTGRES_DB:-harness}
      TRUST_THRESHOLD: ${TRUST_THRESHOLD:-3}
      TRACE_PATH: ${TRACE_PATH:-/tmp/traces.jsonl}
      MOCK_LLM_ENABLED: ${MOCK_LLM_ENABLED:-true}
      MODEL_NAME: ${MODEL_NAME:-mock-agent-v1}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://mock-llm:8080}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  harness_pgdata:
